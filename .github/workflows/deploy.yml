name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # 🔐 Configure AWS
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # 🐳 Login to ECR
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    # 🏗 Build & Push Backend
    - name: Build and Push Backend
      run: |
        docker build -t devopsify-backend ./backend
        docker tag devopsify-backend:latest 211125723951.dkr.ecr.us-east-1.amazonaws.com/devopsify-backend:latest
        docker push 211125723951.dkr.ecr.us-east-1.amazonaws.com/devopsify-backend:latest

    # 🏗 Build & Push Frontend
    - name: Build and Push Frontend
      run: |
        docker build -t devopsify-frontend ./frontend
        docker tag devopsify-frontend:latest 211125723951.dkr.ecr.us-east-1.amazonaws.com/devopsify-frontend:latest
        docker push 211125723951.dkr.ecr.us-east-1.amazonaws.com/devopsify-frontend:latest

    # 🚀 Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd devopsify
          docker-compose pull
          docker-compose up -d 